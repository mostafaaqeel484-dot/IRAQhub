name: IRAQhub RX6 Factory isolated EPG CHMAX logo preview

on:
  push:
    branches: [ 'feature/rx6-factory-epg-chmax-logo-20261111' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rx6-factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install pinned Android SDK and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;29.0.14206865'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test logo background removal and existing regressions
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Assemble separate package
        run: gradle :app:assembleRx6FactoryPreview --no-daemon --stacktrace
      - name: Check APK signing, package and ARMv7 libraries
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/rx6FactoryPreview/app-rx6FactoryPreview.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          unzip -tq "$APK"
          "$BT/apksigner" verify --min-sdk-version 34 --verbose "$APK"
          "$BT/zipalign" -c -v 4 "$APK"
          "$BT/aapt" dump badging "$APK" > /tmp/rx6-badging.txt
          grep -F "package: name='com.smarthub.plus.rx6factory'" /tmp/rx6-badging.txt
          grep -F "native-code: 'armeabi-v7a'" /tmp/rx6-badging.txt
          mkdir -p dist
          cp "$APK" dist/IRAQhub_RX6_Factory_EPG_CHMAX_Logo_Preview.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish experimental package as draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="rx6-factory-only-preview-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            dist/IRAQhub_RX6_Factory_EPG_CHMAX_Logo_Preview.apk dist/SHA256SUMS.txt \
            --draft --prerelease --target "$GITHUB_SHA" \
            --title 'RX6 Factory · standalone CI preview' \
            --notes 'Not receiver-tested: package com.smarthub.plus.rx6factory. EPG prewarm, CHMAX cached logo update, provider logos, pale matte removal and larger channel logo only.'
