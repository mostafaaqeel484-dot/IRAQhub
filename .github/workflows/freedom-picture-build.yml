name: Build Freedom Picture 1.0
on:
  push:
    branches:
      - feature/freedom-picture-100-20261108
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract Freedom Picture independent source
        run: unzip -q .source/FreedomPicture_1.0_Source.zip -d .
      - name: Inspect preinstalled tools
        run: |
          gradle --version
          ls -l "$ANDROID_HOME/platforms" || true
      - name: Compile Android installable debug APK
        working-directory: FreedomPicture
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload Freedom Picture APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FreedomPicture-1.0-debug-apk
          path: FreedomPicture/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
