name: IRAQhub 4.0.4 Direct FFmpeg JNI ARMv7 Experimental Preflight
on:
  push:
    branches: ['feature/iraqhub-403-native422-ffmpeg-jni-multires-20261109', 'fix/iraqhub-404-epg-sports-native422-20261109']
  workflow_dispatch:

permissions:
  # Allow a private draft release only when Actions artifact storage is exhausted.
  contents: write

concurrency:
  group: iraqhub-403-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ffmpeg-native-test:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install exact Android SDK/NDK and CMake
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' \
            'ndk;29.0.14206865' 'cmake;3.22.1'
      - name: Install pinned Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/gradle-8.11.1-bin.zip"
          curl --fail --location --silent --show-error --retry 10 \
            --retry-delay 5 --retry-all-errors --output "$ZIP" \
            'https://downloads.gradle.org/distributions/gradle-8.11.1-bin.zip'
          unzip -tq "$ZIP"
          unzip -q "$ZIP" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.11.1/bin" >> "$GITHUB_PATH"
      - name: Unit-test Java 422/420 1080/720/540/360/260 and fast EPG
        run: |
          gradle :app:testDebugUnitTest --no-daemon --stacktrace
          gradle :app:testDebugUnitTest \
            --tests 'com.smarthub.plus.Native422OutputProfileTest' \
            --tests 'com.smarthub.plus.FastEpgNowNextTest' \
            --no-daemon --stacktrace
      - name: Verify FFmpeg official PGP source and cross-compile LGPL ARMv7
        run: |
          bash scripts/build-native422-ffmpeg.sh "$GITHUB_WORKSPACE/.native422/ffmpeg-armv7"
      - name: Build real FFmpeg-linked JNI APK (never overwrite main)
        run: |
          gradle :app:assembleNative422Preview \
            -Pnative422FfmpegRoot="$GITHUB_WORKSPACE/.native422/ffmpeg-armv7" \
            --no-daemon --stacktrace
      - name: Verify ARM32 JNI, FFmpeg dependencies, signing and isolated process
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/native422Preview/app-native422Preview.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/libiraqhub_native422.so'
          for lib in avformat avcodec swscale avutil; do
            unzip -l "$APK" | grep -q "lib/armeabi-v7a/lib${lib}.so"
          done
          if unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/'; then
            echo "Unexpected 64-bit ABI in X5M build";exit 2
          fi
          unzip -p "$APK" lib/armeabi-v7a/libiraqhub_native422.so > /tmp/native422.so
          LLVM="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin"
          python3 - /tmp/native422.so <<'PY'
          import sys,struct
          h=open(sys.argv[1],"rb").read(20)
          assert h[:4]==b"\x7fELF" and h[4]==1 and h[5]==1
          assert struct.unpack_from("<H",h,18)[0]==40
          PY
          readelf -Ws /tmp/native422.so |
            grep 'Java_com_smarthub_plus_Native422Decoder_nativeRun'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" |
            grep -q "package: name='com.smarthub.plus.x5m403jni'"
          echo "Native JNI compiles and APK passes static ELF/signature tests."
          echo "Physical X5M decoded/moving video FPS remains UNVERIFIED."
      - name: Publish experimental APK to Actions artifacts (when quota allows)
        id: upload_ci
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: IRAQhub_404_Experimental_Native422_ARMv7_Debug_NOT_DEVICE_VERIFIED
          path: app/build/outputs/apk/native422Preview/app-native422Preview.apk
          if-no-files-found: error
          retention-days: 7
      - name: Preserve experimental APK in a private draft release if artifact upload failed
        if: steps.upload_ci.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/native422Preview/app-native422Preview.apk
          test -s "$APK"
          sha256sum "$APK" > "$RUNNER_TEMP/SHA256SUMS.txt"
          TAG="iraqhub-404-native422-ci-${GITHUB_RUN_ID}"
          # Draft: no public release, no production tag, no main branch changes.
          gh release create "$TAG" \
            "$APK#IRAQhub_4.0.4_Native422_ARMv7_Experimental_Debug.apk" \
            "$RUNNER_TEMP/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" \
            --title "IRAQhub 4.0.4 Native422 X5M (CI experimental, NOT device verified)" \
            --notes "Side-by-side Android ARMv7 debug preview. CI JVM, FFmpeg, ELF and APK-signing checks passed. Continuous 4:2:2 playback on physical Amlogic X5M has NOT been verified. Built from commit $GITHUB_SHA." \
            --draft --prerelease
          echo "APK preserved as a DRAFT release asset (not published): $TAG"
          gh release view "$TAG" --json assets --jq '.assets[].name'
      - name: Report artifact upload outcome
        if: always() && steps.upload_ci.outcome == 'success'
        shell: bash
        run: echo "Experimental APK uploaded as an Actions artifact."
