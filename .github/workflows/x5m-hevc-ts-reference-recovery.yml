name: IRAQhub X5M HEVC TS Reference Recovery Preview

on:
  push:
    branches: [ 'fix/x5m-hevc-ts-reference-stall-20261108' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mpv-hevc-ts-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Upstream dev.jdtech.mpv:libmpv:1.0.0 publishes classfile major 65
          # (Java 21); Java 17 javac rejects MPVLib before Android dexing.
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;29.0.14206865'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests, including Commons attribution
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Validate HEVC packet integrity and bounded stall recovery unit tests
        run: |
          gradle :app:testDebugUnitTest --tests 'com.smarthub.plus.TsSpliceContinuityTest' --tests 'com.smarthub.plus.Mpv422StreamHealthPolicyTest' --no-daemon --stacktrace
      - name: Compile and assemble Debug
        run: gradle :app:assembleX5mPreview --no-daemon --stacktrace
      - name: Verify MPV class and native libraries in the ACTUAL APK
        run: |
          python3 - <<'PY'
          import zipfile
          name="app/build/outputs/apk/x5mPreview/app-x5mPreview.apk"
          with zipfile.ZipFile(name) as apk:
              names=set(apk.namelist())
              for abi in ("armeabi-v7a",):
                  for lib in ("libmpv.so","libplayer.so"):
                      path=f"lib/{abi}/{lib}"
                      print(path, "PRESENT" if path in names else "MISSING")
                      assert path in names, f"Missing {path}"
              # Reject accidental dual ABI or missing ARMv7 binaries: this
              # experiment must be installable on a 32-bit-only Android TV.
              native=[n for n in names if n.startswith("lib/") and n.endswith(".so")]
              assert native, "No native libraries in APK"
              unexpected=sorted(n for n in native if not n.startswith("lib/armeabi-v7a/"))
              assert not unexpected, f"Unexpected non-ARMv7 native libraries: {unexpected[:12]}"
              assert "lib/armeabi-v7a/libc++_shared.so" in names, "Missing ARMv7 C++ runtime"
              print("32-bit ARMv7-only native payload validated:",len(native),"shared libraries")
              dex=[n for n in names if n.startswith("classes") and n.endswith(".dex")]
              assert dex,"No app DEX"
              # Search actual DEX class_defs, NOT constant pool references:
              # a Java caller may reference MPVLib without the AAR class
              # being packaged, causing exactly NoClassDefFoundError.
              from struct import unpack_from
              def has_class(data, descriptor):
                  if data[:4]!=bytes((100,101,120,10)): return False
                  u32=lambda off:unpack_from("<I",data,off)[0]
                  strings_off=u32(0x3c)
                  types_off=u32(0x44)
                  classes_count=u32(0x60)
                  classes_off=u32(0x64)
                  for i in range(classes_count):
                      class_idx=u32(classes_off+32*i)
                      name_idx=u32(types_off+4*class_idx)
                      pointer=u32(strings_off+4*name_idx)
                      # Skip string_data_item UTF16 length, encoded ULEB128.
                      for k in range(5):
                          b=data[pointer]
                          pointer+=1
                          if b<128:break
                      stop=data.index(0,pointer)
                      if data[pointer:stop].decode("utf8","replace")==descriptor:
                          return True
                  return False
              found=any(has_class(apk.read(n),
                     "Ldev/jdtech/mpv/MPVLib;") for n in dex)
              print("MPVLib class-definition packaged:",found,"DEX files",len(dex))
              assert found, "MPVLib actual class_def absent from installable APK"
          PY
      - name: Verify packaged 32-bit ARMv7 libmpv and libc++ ABI contract
        shell: bash
        run: |
          set -euo pipefail
          ndk="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64"
          test -x "$ndk/bin/llvm-nm"
          python3 - <<'PY'
          import zipfile,os,pathlib,hashlib
          apk="app/build/outputs/apk/x5mPreview/app-x5mPreview.apk"
          out=pathlib.Path("build/cxx-audit")
          out.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(apk) as package:
            for abi in ("armeabi-v7a",):
              for lib in ("libmpv.so","libc++_shared.so","libplayer.so"):
                key=f"lib/{abi}/{lib}"
                assert key in package.namelist(),f"Missing {key}"
                data=package.read(key)
                loc=out/abi/lib
                loc.parent.mkdir(parents=True,exist_ok=True)
                loc.write_bytes(data)
                assert data[:4]==bytes((127,69,76,70)),f"Invalid ELF in {key}"
                print(key,len(data),hashlib.sha256(data).hexdigest())
          PY
          python3 - <<'PY'
          import pathlib, subprocess, os
          bin_dir=pathlib.Path(os.environ['ANDROID_HOME']) / 'ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin'
          nm=str(bin_dir/'llvm-nm')
          elf=str(bin_dir/'llvm-readelf')
          def exported(path):
              output=subprocess.check_output([nm,'-D','--defined-only',str(path)],text=True)
              return {line.rsplit(' ',1)[-1].split('@')[0] for line in output.splitlines() if line.strip()}
          def undefined(path):
              output=subprocess.check_output([nm,'-D','--undefined-only',str(path)],text=True)
              return {line.rsplit(' ',1)[-1].split('@')[0] for line in output.splitlines() if line.strip()}
          for abi in ('armeabi-v7a',):
              root=pathlib.Path('build/cxx-audit')/abi
              runtime=root/'libc++_shared.so'
              mpv=root/'libmpv.so'
              player=root/'libplayer.so'
              native_exports=exported(runtime)
              print(abi, 'runtime exports:',len(native_exports),flush=True)
              expected_prefix='_ZNSt6__ndk127__from_chars_floating_point'
              assert any(x.startswith(expected_prefix) for x in native_exports),(
                  f'{abi}: packaged libc++ lacks libc++20 floating from_chars')
              assert '_ZNSt6__ndk18to_charsEPcS0_f' in native_exports,(
                  f'{abi}: missing original to_chars(float) export')
              for name in (mpv,player):
                  imported=undefined(name)
                  std={x for x in imported if x.startswith('_ZNSt6__ndk1')}
                  missing=sorted(std-native_exports)
                  print(f'{abi} {name.name}: imported {len(std)} std::__ndk1 symbols; unresolved {len(missing)}',flush=True)
                  if missing:
                      print('UNRESOLVED C++ ABI:','\n'.join(missing[:100]),flush=True)
                  assert not missing, f'{abi} {name.name} has {len(missing)} absent C++ ABI symbols'
              for name in (runtime,mpv,player):
                  result=subprocess.check_output([elf,'-h',str(name)],text=True)
                  klass='ELF32' if abi=='armeabi-v7a' else 'ELF64'
                  assert klass in result, f'{abi} wrong ELF class for {name}'
              print(f'{abi}: all C++ runtime ABI contracts verified',flush=True)
          PY
      - name: Verify Debug signature and alignment
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/x5mPreview/app-x5mPreview.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 26 --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "name='com.smarthub.plus.x5mhevc'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "native-code: 'armeabi-v7a'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "sdkVersion:'26'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "targetSdkVersion:'34'"
          # Existing installation keeps its original package/UID/data intact.
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "name='com.smarthub.plus' "; then
             echo 'ERROR: Preview would overwrite original IRAQhub'; exit 1
          fi
          python3 - <<'PY'
          import zipfile
          apk="app/build/outputs/apk/x5mPreview/app-x5mPreview.apk"
          with zipfile.ZipFile(apk) as pkg:
              assert pkg.testzip() is None, "APK ZIP CRC integrity failed"
          print("Preview APK all ZIP CRC checks passed")
          PY
      # Releases use separate storage from Actions artifacts, which is full.
      # This is an isolated test package: never replace original com.smarthub.plus.
      # Signature is still CI ephemeral, so uninstall PREVIEW only before the next build.
      - name: Publish unverified Debug preview to private draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=iraqhub-400-x5m-hevc-ts-recovery-preview-20261108
          APK=app/build/outputs/apk/x5mPreview/app-x5mPreview.apk
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/IRAQhub_4.0.0_X5M_Android14_ARMv7_HEVC_TS_Recovery_Preview.apk
          # Never attempt a release upload if the expected output is missing.
          test -s "dist/IRAQhub_4.0.0_X5M_Android14_ARMv7_HEVC_TS_Recovery_Preview.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --prerelease --target "$GITHUB_SHA" \
              --title "IRAQhub 4.0.0 · X5M HEVC TS packet continuity + no-frame recovery (Preview)" \
              --notes "PRIVATE DRAFT / UNVERIFIED X5M HEVC RECOVERY: ARMv7 32-bit, Android TV 14, separate com.smarthub.plus.x5mhevc package. Stops synthetic MPEG-TS continuity rewrites which concealed source packet gaps, logs CC and TEI integrity and PVR rollovers, starts clients at newest capture, increases PVR segment from 24 to 48 MiB to reduce rotation discontinuities, triggers ONE SW+GPU-native+Video-only existing TS retry when HEVC yields no decoded frames, fixes white-on-white remote controls. Real X5M field testing required; source loss cannot be repaired by CC headers and HEVC 4:2:2 may remain CPU-limited. Do not uninstall original IRAQhub."
          fi
          gh release upload "$TAG" \
            dist/IRAQhub_4.0.0_X5M_Android14_ARMv7_HEVC_TS_Recovery_Preview.apk \
            dist/SHA256SUMS.txt --clobber
          gh release view "$TAG" --json isDraft,assets --jq '{draft:.isDraft,assets:[.assets[].name]}'
