name: IRAQhub MPV NoClassDefFoundError X5M Fix

on:
  push:
    branches: [ 'fix/iraqhub-400-mpv-noclass-bootstrap-20261107' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mpv-bootstrap-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests, including Commons attribution
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compile and assemble Debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify MPV class and native libraries in the ACTUAL APK
        run: |
          python3 - <<'PY'
          import zipfile
          name="app/build/outputs/apk/debug/app-debug.apk"
          with zipfile.ZipFile(name) as apk:
              names=set(apk.namelist())
              for abi in ("arm64-v8a","armeabi-v7a"):
                  for lib in ("libmpv.so","libplayer.so"):
                      path=f"lib/{abi}/{lib}"
                      print(path, "PRESENT" if path in names else "MISSING")
                      assert path in names, f"Missing {path}"
              dex=[n for n in names if n.startswith("classes") and n.endswith(".dex")]
              assert dex,"No app DEX"
              found=any(b"Ldev/jdtech/mpv/MPVLib;" in apk.read(n)
                        or b"dev/jdtech/mpv/MPVLib" in apk.read(n)
                        for n in dex)
              print("MPVLib runtime DEX packaged:", found, "DEX files", len(dex))
              assert found, "MPVLib class absent from installable APK"
          PY
      - name: Verify Debug signature and alignment
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:'
      # Releases use separate storage from Actions artifacts, which is full.
      # The preview is PRIVATE DRAFT and signed only with CI's temporary Debug key.
      - name: Publish unverified Debug preview to private draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=iraqhub-400-mpv-bootstrap-compat-preview-20261107
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/IRAQhub_4.0.0_X5M_MPV_Bootstrap_Fix_Debug.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --prerelease --target "$GITHUB_SHA" \
              --title "IRAQhub 4.0.0 · X5M MPV Native Bootstrap Compatibility Fix (Debug)" \
              --notes "PRIVATE DRAFT TEST ONLY: X5M MPV NoClassDefFoundError fix: tests upstream stable dev.jdtech.mpv:libmpv:1.0.0, explicit libmpv/player native preload, whole error-cause-chain UI/logcat, CI verifies both ABI native libraries and dev.jdtech.mpv.MPVLib DEX class. No guarantee of X5M runtime video until tested. User-selected VLC fallback remains available. Draft Debug signed temporarily."
          fi
          gh release upload "$TAG" \
            dist/IRAQhub_4.0.0_X5M_MPV_Bootstrap_Fix_Debug.apk \
            dist/SHA256SUMS.txt --clobber
          gh release view "$TAG" --json isDraft,assets --jq '{draft:.isDraft,assets:[.assets[].name]}'
