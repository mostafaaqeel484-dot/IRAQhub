name: IRAQhub+ 4.0.2 X5M Pre-Build Source & Unit Test Gate
on:
  push:
    branches: ['feature/iraqhub-402-logo-ui-engine-20261108']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iraqhub-402-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight-no-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK and pinned 32-bit native toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;29.0.14206865'
      - name: Install Gradle 8.11.1 from official Gradle distribution
        shell: bash
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/gradle-8.11.1-bin.zip"
          mkdir -p "$RUNNER_TEMP/gradle811"
          curl --fail --location --silent --show-error \
            --connect-timeout 20 --max-time 480 \
            --retry 10 --retry-delay 5 --retry-all-errors \
            --output "$DIST" \
            'https://downloads.gradle.org/distributions/gradle-8.11.1-bin.zip'
          unzip -tq "$DIST"
          unzip -q "$DIST" -d "$RUNNER_TEMP/gradle811"
          echo "$RUNNER_TEMP/gradle811/gradle-8.11.1/bin" >> "$GITHUB_PATH"
      - name: Pre-build safety and source asset checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('app')
          build=(root/'build.gradle').read_text()
          manifest=(root/'src/main/AndroidManifest.xml').read_text()
          preview=(root/'src/x5mPreview/AndroidManifest.xml').read_text()
          icon=(root/'src/main/res/drawable-nodpi/iraqhub_logo.jpg').read_bytes()
          assert "applicationIdSuffix '.x5m402'" in build
          assert "versionCode 43" in build and "4.0.2-alpha1" in build
          assert "abiFilters 'armeabi-v7a'" in build and "targetSdk 34" in build
          assert "android:authorities=\"\u0024{applicationId}.files\"" in manifest
          assert 'android:icon="@drawable/iraqhub_logo"' in manifest
          assert 'IRAQhub+ 4.0.2 Preview' in preview
          assert icon.startswith(bytes.fromhex('ffd8ff')) and icon.endswith(bytes.fromhex('ffd9'))
          assert hashlib.sha256(icon).hexdigest()=='09d0f297cc63622aa4a85dbf3962c50a85c3e1e847adb1ee089b7ad183edcdd6'
          # No unsafe OEM front-panel writes or irreversible player removal.
          panel=(root/'src/main/java/com/smarthub/plus/FrontPanelBridge.java').read_text()
          assert 'oemDriverWrites",false' in panel
          assert 'RandomAccessFile("/dev/vfd' not in panel
          assert (root/'src/main/java/com/smarthub/plus/Independent422Activity.java').exists()
          assert (root/'src/main/java/com/smarthub/plus/ReceiverPlaybackOverlay.java').exists()
          print('PASS: X5M ARMv7 ABI, unique package, manifest authority, original verified logo, safe front-panel bridge')
          PY
      - name: All existing JUnit tests and Android Java/Kotlin source compilation
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Targeted 4.0.2 remote and CA indicator unit tests
        run: |
          gradle :app:testDebugUnitTest \
            --tests 'com.smarthub.plus.CaBadgePolicyTest' \
            --tests 'com.smarthub.plus.ChannelNumberInputTest' \
            --tests 'com.smarthub.plus.TigerOsdMetricsTest' \
            --tests 'com.smarthub.plus.TsSpliceContinuityTest' \
            --no-daemon --stacktrace
      - name: Preflight complete, do not assemble APK here
        run: echo "Source and unit tests passed; no 4.0.2 APK assembled by this workflow."
