name: Gazal Standalone Android APK
on:
  push:
    branches: [feature/gazal-audio-sync-standalone-20261109]
    paths:
      - 'gazal-audio-sync/**'
      - '.github/workflows/gazal-android.yml'
  pull_request:
    paths:
      - 'gazal-audio-sync/**'
      - '.github/workflows/gazal-android.yml'
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile standalone Gazal app
        working-directory: gazal-audio-sync
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Print SHA-256
        run: sha256sum gazal-audio-sync/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Gazal-Audio-Sync-Debug-APK
          path: gazal-audio-sync/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
