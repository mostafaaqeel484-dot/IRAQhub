name: IRAQhub USB ADB startup onboarding

on:
  push:
    branches: [ 'feature/iraqhub-400-usb-adb-startup-20261107' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usb-adb-startup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit regression tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build startup-enabled Debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify locally built Debug APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
      # Do not call actions/upload-artifact: this repository's Actions
      # artifact quota was exhausted on PR #26. Do not publish a release from
      # a stacked feature branch until the owner requests a signed preview.
