name: Build Freedom Picture 1.4 Local ADB
on:
  push:
    branches:
      - feature/freedom-picture-140-local-adb-20261108
    paths:
      - .source/FreedomPicture_1.4_Source.zip
      - .github/workflows/freedom-picture-140-build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract standalone Freedom Picture 1.4 source
        run: unzip -q .source/FreedomPicture_1.4_Source.zip -d .
      - name: Compile installable APK
        working-directory: FreedomPicture_1_4
        run: gradle --no-daemon assembleDebug
      - name: Publish debug APK into isolated branch
        run: |
          cp FreedomPicture_1_4/app/build/outputs/apk/debug/app-debug.apk FreedomPicture_1.4_Debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FreedomPicture_1.4_Debug.apk
          git -c commit.gpgsign=false commit -m "build: Freedom Picture 1.4 local ADB APK [skip ci]"
          git push origin HEAD:refs/heads/feature/freedom-picture-140-local-adb-20261108
