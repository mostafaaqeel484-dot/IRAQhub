name: IRAQhub RX6 4.0.18 - Exact Uploaded Source APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'build/rx6-418-exact-source'

permissions:
  contents: write

concurrency:
  group: rx6-418-exact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Verify correct SOURCE ZIP snapshot, not older RX6 branch
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "versionName '4.0.18-rx6'" app/build.gradle
          grep -Fq "versionCode 65" app/build.gradle
          test -s app/src/main/java/com/smarthub/plus/LiveFeedActivity.java
          test -s app/src/main/java/com/smarthub/plus/RemoteDirectionPolicy.java
          test -s app/src/main/java/com/smarthub/plus/ArtworkCachePruner.java
          test -s app/src/main/java/com/smarthub/plus/ChannelLogoCache.kt
          python3 scripts/verify_rx6_418_source.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install exact SDK / build-tools / NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;29.0.14206865'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run all local Android JVM regression tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Assemble side-by-side X5M preview (ARMv7 only)
        run: gradle :app:assembleRx6OriginalPreview --no-daemon --stacktrace
      - name: Verify exact final APK contents, signature and Android 14 compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/rx6OriginalPreview/app-rx6OriginalPreview.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          unzip -tq "$APK"
          "$BT/zipalign" -c -v 4 "$APK"
          "$BT/apksigner" verify --min-sdk-version 34 --verbose --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/iraqhub-badging.txt"
          grep -F "package: name='com.smarthub.plus.rx6api418'" "$RUNNER_TEMP/iraqhub-badging.txt"
          grep -F "native-code: 'armeabi-v7a'" "$RUNNER_TEMP/iraqhub-badging.txt"
          python3 - "$APK" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              files=set(apk.namelist())
              assert any(name.startswith('classes') and name.endswith('.dex') for name in files)
              so=[name for name in files if name.startswith('lib/') and name.endswith('.so')]
              assert so and all(name.startswith('lib/armeabi-v7a/') for name in so),so
              assert 'lib/armeabi-v7a/libc++_shared.so' in files
              print('Verified 32-bit ARMv7 APK libraries:',len(so))
          PY
          mkdir -p dist
          cp "$APK" dist/IRAQhub_RX6_4.0.18_X5M_SideBySide_Debug.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Store signed preview in a draft pre-release (do not publish as stable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="iraqhub-rx6-418-source-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            dist/IRAQhub_RX6_4.0.18_X5M_SideBySide_Debug.apk \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --draft --prerelease \
            --title "IRAQhub RX6 4.0.18 X5M · source-matched preview" \
            --notes "Built from the uploaded RX6 4.0.18 source, not from an older PR. CI unit tests, ARMv7 package, zip alignment and Android 14 signature checked. This is a side-by-side, temporary DEBUG-signed APK (com.smarthub.plus.rx6api418). Live DVB scan, 4:2:2, EPG, WebView and remote controls remain unverified on the physical X5M. Do not replace production or treat as stable."
          mkdir -p "$RUNNER_TEMP/apk-verify"
          gh release download "$TAG" -D "$RUNNER_TEMP/apk-verify" -p '*.apk' -p SHA256SUMS.txt
          (cd "$RUNNER_TEMP/apk-verify" && sha256sum -c SHA256SUMS.txt)
          cmp "dist/IRAQhub_RX6_4.0.18_X5M_SideBySide_Debug.apk" \
            "$RUNNER_TEMP/apk-verify/IRAQhub_RX6_4.0.18_X5M_SideBySide_Debug.apk"
          echo "Verified draft: https://github.com/${GH_REPO}/releases/tag/${TAG}"
