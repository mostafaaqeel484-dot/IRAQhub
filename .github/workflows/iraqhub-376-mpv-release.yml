name: IRAQhub 3.7.6 MPV + DVB Recovery Draft Build

on:
  push:
    branches: [ 'feature/iraqhub-376-mpv-zap-recovery-backup-20261107' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iraqhub-376-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout IRAQhub 3.7.6
        uses: actions/checkout@v4
      - name: Java 21 (required to consume libmpv AAR Java 21 bytecode)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Accept licenses and install Android 36 SDK and 35 build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' >/dev/null
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests (MPV choice, DVB watchdog, backup whitelist)
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build signed Debug with in-process libmpv
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify Debug APK signature and version
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 2
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|armeabi-v7a)/lib(mpv|player)\\.so' || true
      - name: Save Debug to draft release without consuming Actions storage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v3.7.6-rc1
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/IRAQhub_3.7.6_MPV_Debug.apk
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --prerelease --target "$GITHUB_SHA" \
              --title "IRAQhub 3.7.6 RC1 — MPV/VLC, Fast DVB, Recovery & Backups (X5M)" \
              --notes-file docs/RELEASE_376_MPV_AR.md
          fi
          gh release upload "$TAG" dist/IRAQhub_3.7.6_MPV_Debug.apk --clobber
      - name: Assemble unsigned Release APK
        timeout-minutes: 18
        run: gradle :app:assembleRelease --no-daemon
      - name: Optionally sign Release with developer-owned persistent keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.IRAQHUB_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.IRAQHUB_RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.IRAQHUB_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.IRAQHUB_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             dist/IRAQhub_3.7.6_MPV_Release_UNSIGNED.apk
          if [[ -n "${RELEASE_KEYSTORE_BASE64:-}" && -n "${RELEASE_KEY_ALIAS:-}" &&
                -n "${RELEASE_STORE_PASSWORD:-}" && -n "${RELEASE_KEY_PASSWORD:-}" ]]; then
            KEY="$RUNNER_TEMP/iraqhub-release-signing.jks"
            trap 'rm -f "$KEY"' EXIT
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEY"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 \
              dist/IRAQhub_3.7.6_MPV_Release_UNSIGNED.apk \
              "$RUNNER_TEMP/aligned.apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks "$KEY" --ks-key-alias "$RELEASE_KEY_ALIAS" \
              --ks-pass env:RELEASE_STORE_PASSWORD \
              --key-pass env:RELEASE_KEY_PASSWORD \
              --out dist/IRAQhub_3.7.6_MPV_Release_SIGNED.apk \
              "$RUNNER_TEMP/aligned.apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
              dist/IRAQhub_3.7.6_MPV_Release_SIGNED.apk
            echo "Release is signed with developer-provided keystore"
          else
            echo "::notice::Production keystore secrets not configured; unsigned Release only."
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Upload 3.7.6 RC1 APKs to private Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v3.7.6-rc1
          gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt docs/MPV_LICENSE_REVIEW_376.md --clobber
          # Do not publish a GPL-containing native build before license review.
          gh release view "$TAG" --json tagName,url,isDraft,isPrerelease,assets
