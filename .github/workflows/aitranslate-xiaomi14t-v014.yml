name: AI Translate Xiaomi 14T V0.14 LibreTranslate
on:
  push:
    branches: [build/aitranslate-xiaomi14t-libretranslate-v014]
    paths:
      - "ai-translate/Xiaomi14T-V014-LibreTranslate.tar.xz.base64"
      - ".github/workflows/aitranslate-xiaomi14t-v014.yml"
  pull_request:
    branches: [main]
    paths:
      - "ai-translate/Xiaomi14T-V014-LibreTranslate.tar.xz.base64"
      - ".github/workflows/aitranslate-xiaomi14t-v014.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore Xiaomi 14T V0.14 source and verify archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ai-translate/phone14
          base64 -d ai-translate/Xiaomi14T-V014-LibreTranslate.tar.xz.base64 > /tmp/xiaomi14t-v014.tar.xz
          echo "2a562d9809ff53727af6a69a4ec9262e42a9a6997f101a6c3193ba12df516400  /tmp/xiaomi14t-v014.tar.xz" | sha256sum -c -
          tar -xJf /tmp/xiaomi14t-v014.tar.xz -C ai-translate/phone14
          grep -q 'versionCode = 14' ai-translate/phone14/Xiaomi14T_V014_LibreTranslate/app/build.gradle.kts
          test -f ai-translate/phone14/Xiaomi14T_V014_LibreTranslate/app/src/main/java/com/iraqhub/aitranslate/CloudTranslation.kt
          if grep -q 'FLAG_SECURE' ai-translate/phone14/Xiaomi14T_V014_LibreTranslate/app/src/main/java/com/iraqhub/aitranslate/OcrCaptureService.kt; then
            echo 'Unexpected secure overlay flag in OCR'; exit 1
          fi
      - name: Install Android SDK Platform 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Download SenseVoice Japanese fallback model
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17.tar.bz2"
          curl -fL --retry 4 --retry-delay 4 -o /tmp/sensevoice.tar.bz2 "$URL"
          mkdir -p /tmp/sensevoice ai-translate/phone14/Xiaomi14T_V014_LibreTranslate/app/src/main/assets/sensevoice
          tar -xjf /tmp/sensevoice.tar.bz2 -C /tmp/sensevoice
          DIR=/tmp/sensevoice/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17
          test "$(stat -c %s "$DIR/model.int8.onnx")" -gt 100000000
          cp "$DIR/model.int8.onnx" "$DIR/tokens.txt" ai-translate/phone14/Xiaomi14T_V014_LibreTranslate/app/src/main/assets/sensevoice/
      - name: Download English-only 20M Zipformer streaming INT8 model
        shell: bash
        run: |
          set -euo pipefail
          MODEL_URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-en-20M-2023-02-17.tar.bz2"
          curl -fL --retry 4 --retry-delay 4 -o /tmp/english_zipformer.tar.bz2 "$MODEL_URL"
          mkdir -p /tmp/english_zipformer ai-translate/phone14/Xiaomi14T_V014_LibreTranslate/app/src/main/assets/english-zipformer
          tar -xjf /tmp/english_zipformer.tar.bz2 -C /tmp/english_zipformer
          DIR=/tmp/english_zipformer/sherpa-onnx-streaming-zipformer-en-20M-2023-02-17
          test "$(stat -c %s "$DIR/encoder-epoch-99-avg-1.int8.onnx")" -gt 20000000
          cp "$DIR/encoder-epoch-99-avg-1.int8.onnx" "$DIR/decoder-epoch-99-avg-1.onnx" "$DIR/joiner-epoch-99-avg-1.int8.onnx" "$DIR/tokens.txt" ai-translate/phone14/Xiaomi14T_V014_LibreTranslate/app/src/main/assets/english-zipformer/
      - name: Assemble Xiaomi 14T phone application
        shell: bash
        working-directory: ai-translate/phone14/Xiaomi14T_V014_LibreTranslate
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK and CPU native ABIs
        shell: bash
        run: |
          set -euo pipefail
          APK=ai-translate/phone14/Xiaomi14T_V014_LibreTranslate/app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK" | tail -1
          unzip -Z1 "$APK" | grep 'assets/sensevoice/model.int8.onnx'
          unzip -Z1 "$APK" | grep 'assets/english-zipformer/encoder-epoch-99-avg-1.int8.onnx'
          unzip -Z1 "$APK" | grep 'assets/english-zipformer/joiner-epoch-99-avg-1.int8.onnx'
          unzip -Z1 "$APK" | grep 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          sha256sum "$APK"
      - name: Upload Xiaomi 14T Selectable OCR APK
        uses: actions/upload-artifact@v4
        with:
          name: AITranslate-Xiaomi14T-V0.14-Azure-Gemini-Groq-APK
          path: ai-translate/phone14/Xiaomi14T_V014_LibreTranslate/app/build/outputs/apk/debug/*.apk
          retention-days: 30
