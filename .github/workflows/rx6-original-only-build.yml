name: RX6 Original Source Only - Android 14 X5M
on:
  push:
    branches: [ 'feature/rx6-original-source-only-*', 'feature/rx6-poster-source-switches-20261111', 'fix/rx6-chmax-timeout-osn-epg-20261111', 'feature/rx6-native-epg-manual-source-20261111', 'feature/rx6-provider-branding-country-flags-20261111' ]
  pull_request:
    branches: [ 'feature/rx6-original-source-only-20261111' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned source dependencies
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;29.0.14206865'
      - name: Confirm ORIGINAL RX assets are present
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/rx239/walls/horizontal-dark-v230.png
          test -s app/src/main/assets/rx239/walls/horizontal-light-v230.png
          test -s app/src/main/assets/rx239/cards/live-tv-neutral.png
          test -s app/src/main/assets/receiver-logos/index.json
          test -s app/src/main/assets/logo-resolver/mapping.json
      - name: Verify all original assets byte for byte
        run: |
          sha256sum -c RX6_ORIGINAL_ASSETS.sha256
          sha256sum -c RX6_ORIGINAL_UI.sha256
      - name: Verify workbook-derived provider and channel register
        run: |
          python3 - <<'PY'
          import gzip, json
          path='app/src/main/assets/provider-branding/catalog-v1.json.gz'
          with gzip.open(path,'rt',encoding='utf-8') as source:
              data=json.load(source)
          assert len(data['p'])==234, 'Provider count changed'
          assert len(data['c'])==1376, 'Channel associations changed'
          assert len(data['a'])==7, 'Verified arena service variants changed'
          assert all(len(p)>=3 and len(p[1])==2 for p in data['p'])
          assert not any(p[0].startswith('TVP0') for p in data['p'])
          print('Provider register OK: 234 providers, 1376 channel relationships')
          PY
      - name: Test only uploaded ORIGINAL source
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build independent package from uploaded source
        run: gradle :app:assembleRx6OriginalPreview --no-daemon
      - name: Check output ABI, package ID and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/rx6OriginalPreview/app-rx6OriginalPreview.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          "$BT/apksigner" verify --min-sdk-version 34 "$APK"
          "$BT/zipalign" -c 4 "$APK"
          "$BT/aapt" dump badging "$APK" | grep -F "package: name='com.smarthub.plus.rx6providers'"
          "$BT/aapt" dump badging "$APK" | grep -F "native-code: 'armeabi-v7a'"
          python3 - <<'PY'
          import json, zipfile
          apk='app/build/outputs/apk/rx6OriginalPreview/app-rx6OriginalPreview.apk'
          with zipfile.ZipFile(apk) as package:
              data=json.loads(package.read('assets/provider-branding/catalog-v1.json'))
          assert len(data['p'])==234 and len(data['c'])==1376
          print('Packaged Android provider lookup verified at runtime asset path')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: IRAQhub_RX6_Provider_Logos_Flags_APK
          path: app/build/outputs/apk/rx6OriginalPreview/*.apk
          if-no-files-found: error
