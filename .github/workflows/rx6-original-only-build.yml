name: RX6 Original Source Only - Android 14 X5M
on:
  push:
    branches: [ 'feature/rx6-original-source-only-*', 'feature/rx6-poster-source-switches-20261111', 'fix/rx6-chmax-timeout-osn-epg-20261111', 'feature/rx6-native-epg-manual-source-20261111', 'feature/rx6-provider-branding-country-flags-20261111', 'feature/rx6-authentic-provider-artwork-api-20261112', 'feature/rx6-provider-only-dsmart-api-20261112', 'feature/rx6-api-anime-db-branding-20261112', 'fix/rx6-provider-family-channel-mapping-20261112', 'feature/rx6-separated-channel-provider-logos-api-133-20261112', 'fix/rx6-poster-chmax-bulk-422-health-perf-20261112', 'feature/rx6-zero-overlay-brand-editor-infobar-build-20261112', 'feature/rx6-408-infobar-channel-custom-osn-20261112', 'fix/rx6-408-compact-infobar-real-flags-18pct-20261113', 'fix/rx6-410-centered-epg-signal-background-osn-20261113', 'feature/rx6-411-gold-floating-posters-audio-subtitles-20261113' ]
  pull_request:
    branches: [ 'feature/rx6-original-source-only-20261111' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned source dependencies
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;29.0.14206865'
      - name: Confirm ORIGINAL RX assets are present
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/rx239/walls/horizontal-dark-v230.png
          test -s app/src/main/assets/rx239/walls/horizontal-light-v230.png
          test -s app/src/main/assets/rx239/cards/live-tv-neutral.png
          test -s app/src/main/assets/receiver-logos/index.json
          test -s app/src/main/assets/logo-resolver/mapping.json
      - name: Verify all original assets byte for byte
        run: |
          sha256sum -c RX6_ORIGINAL_ASSETS.sha256
          sha256sum -c RX6_ORIGINAL_UI.sha256
      - name: Verify workbook-derived provider and channel register
        run: |
          python3 - <<'PY'
          import gzip, json
          path='app/src/main/assets/provider-branding/catalog-v1.json.gz'
          with gzip.open(path,'rt',encoding='utf-8') as source:
              data=json.load(source)
          assert len(data['p'])==234, 'Provider count changed'
          assert len(data['c'])==1376, 'Channel associations changed'
          assert len(data['a'])==7, 'Verified arena service variants changed'
          assert all(len(p)>=3 and len(p[1])==2 for p in data['p'])
          assert not any(p[0].startswith('TVP0') for p in data['p'])
          print('Provider register OK: 234 providers, 1376 channel relationships')
          PY
      - name: RX6 source and approved-art audit before Gradle
        run: |
          python3 scripts/check_rx6_provider_logo_audit.py
          python3 - <<'PY'
          import csv, json
          with open("artwork-review/RX6_234_Logo_Audit_Report.csv", encoding="utf-8-sig", newline="") as f:
              review=list(csv.DictReader(f))
          with open("app/src/main/assets/provider-branding/approved-provider-sources.json", encoding="utf-8") as f:
              selected=json.load(f)["entries"]
          assert len(review)==234
          assert len(selected)==133
          assert len({v["id"] for v in selected})==133
          blocked={v["provider_id"] for v in review if v["image_review"]=="blocked_wrong_brand_or_flag"}
          assert len(blocked)>=26
          assert not (blocked & {v["id"] for v in selected})
          assert all(v["url"].startswith("https://") for v in selected)
          print("RX6 source audit: 234 rows, 133 approved, 26 rejected, zero collisions")
          PY
      - name: Bundle only verified provider logos (CHMAX owns channel logos)
        run: |
          # Wikimedia occasionally returns transient HTTP 429/5xx for 1-3 images.
          # Every successful asset stays cached on disk for later attempts.
          # Fail closed if any verified provider mark is still unavailable.
          success=0
          for attempt in 1 2 3 4 5 6; do
            if python3 scripts/fetch_rx6_provider_logos.py; then
              success=1
              break
            fi
            echo "Retrying pinned provider artwork download (attempt ${attempt}/6)"
            sleep 8
          done
          test "$success" -eq 1
          python3 - <<'PY'
          import json
          result=json.load(open("app/src/main/assets/provider-branding/logo-build-report.json"))
          assert result["downloaded"]>=31 and not result["missing_required"],result
          assert 48<=result["providers"]<=61,result
          assert result["channels"]==0,result
          print("RX6 real logo assets bundled",result["downloaded"])
          PY
      - name: Bundle true offline national flag PNGs (never emoji)
        run: |
          python3 scripts/bundle_rx6_country_flags.py
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('app/src/main/assets/provider-branding/country-flags')
          state=json.loads((root/'index.json').read_text())
          assert {'AE','AL','RS','HR','PL','IQ','QA','TR'}.issubset(set(state['countries']))
          assert all((root/(code.lower()+'.png')).read_bytes().startswith(bytes([137,80,78,71,13,10,26,10])) for code in state['countries'])
          print('Verified real flag PNGs',len(state['countries']))
          PY
      - name: Test only uploaded ORIGINAL source
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build independent package from uploaded source
        run: gradle :app:assembleRx6OriginalPreview --no-daemon
      - name: Check output ABI, package ID and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/rx6OriginalPreview/app-rx6OriginalPreview.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          "$BT/apksigner" verify --min-sdk-version 34 "$APK"
          "$BT/zipalign" -c 4 "$APK"
          "$BT/aapt" dump badging "$APK" | grep -F "package: name='com.smarthub.plus.rx6api234'"
          "$BT/aapt" dump badging "$APK" | grep -F "native-code: 'armeabi-v7a'"
          python3 - <<'PY'
          import json, zipfile
          apk='app/build/outputs/apk/rx6OriginalPreview/app-rx6OriginalPreview.apk'
          with zipfile.ZipFile(apk) as package:
              data=json.loads(package.read('assets/provider-branding/catalog-v1.json'))
          assert len(data['p'])==234 and len(data['c'])==1376
          media=json.loads(package.read('assets/provider-branding/real-logo-manifest.json')) if False else None
          with zipfile.ZipFile(apk) as package:
              media=json.loads(package.read('assets/provider-branding/real-logo-manifest.json'))
              assert media['channels']==[]
              names=set(package.namelist())
              for p in media['providers']:
                  assert 'assets/provider-branding/images/'+p['asset'] in names,p
              flags=json.loads(package.read('assets/provider-branding/country-flags/index.json'))
              assert len(flags['countries'])>=20
              for code in flags['countries']:
                  picture=package.read('assets/provider-branding/country-flags/'+code.lower()+'.png')
                  assert picture[:8]==bytes([137,80,78,71,13,10,26,10])
              assert 'AE' in flags['countries']
          print('RX6 provider-only register, compact UI country flags and channel exclusion verified')
          PY
      - name: Publish verified X5M RX6 Debug APK to private draft Release (artifact quota-safe)
        if: ${{ github.ref == 'refs/heads/fix/rx6-poster-chmax-bulk-422-health-perf-20261112' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="iraqhub-rx6-pr61-${GITHUB_RUN_ID}"
          SOURCE="app/build/outputs/apk/rx6OriginalPreview/app-rx6OriginalPreview.apk"
          NAME="IRAQhub_RX6_PR61_X5M_4.0.6_Debug.apk"
          test -s "$SOURCE"
          mkdir -p dist
          cp "$SOURCE" "dist/$NAME"
          (cd dist && sha256sum "$NAME" > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          gh release create "$TAG" "dist/$NAME" dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --draft --prerelease \
            --title "RX6 PR61 · X5M Android 14 ARMv7 Debug APK · not receiver-tested" \
            --notes "Signed debug APK for com.smarthub.plus.rx6api234 from PR #61: TMDB-first InfoBar poster fallback, whole-satellite authorised CHMAX package logos, independent 4:2:2 visible-frame checks and UI performance. Source and unit/build checks only; no physical X5M playback validation. Debug keystore may differ from prior runs, requiring uninstall of an older test build with the same package (back up settings first). Not stable and not main app."
          echo "RX6 PR61 draft Release created: $TAG"
      - name: Publish artifact on other RX6 branches
        if: ${{ github.ref != 'refs/heads/fix/rx6-poster-chmax-bulk-422-health-perf-20261112' }}
        uses: actions/upload-artifact@v4
        with:
          name: IRAQhub_RX6_411_Gold_Floating_Posters_Audio_Captions_APK
          path: app/build/outputs/apk/rx6OriginalPreview/*.apk
          if-no-files-found: error
