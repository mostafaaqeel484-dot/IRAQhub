name: IraqBISS Glass TV APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/iraqbiss-feed-glass-20261126
    paths:
      - 'IraqBissGlass/**'
      - '.github/workflows/iraqbiss-glass-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile Android TV APK
        working-directory: IraqBissGlass
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK and package
        run: |
          set -euxo pipefail
          APK=IraqBissGlass/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -20
      - name: Publish beta APK on GitHub release
        if: github.ref == 'refs/heads/feature/iraqbiss-feed-glass-20261126'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp IraqBissGlass/app/build/outputs/apk/debug/app-debug.apk IraqBISS-tvOS-NightScenes-v0.4.apk
          TAG=iraqbiss-glass-v0.4.0-beta
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" IraqBISS-tvOS-NightScenes-v0.4.apk --clobber
          else
            gh release create "$TAG" IraqBISS-tvOS-NightScenes-v0.4.apk --target "${{ github.sha }}" --title "IraqBISS Glass TV v0.4 · Night Scenes & Dock" --notes "Night Scenes and Liquid Glass Dock layout inspired by techgenius1/tvOS-Launcher (Apache-2.0). Native feed sources, snapshots and overlays remain. Device testing required." --prerelease
          fi
      - name: Upload Actions artifact (optional)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: IraqBISS-TV-NightScenes-v0.4
          path: IraqBissGlass/app/build/outputs/apk/debug/app-debug.apk
