name: AI Translate Xiaomi14T V0.1 APK
on:
  push:
    branches:
      - build/ai-translate-xiaomi14t-v01
    paths:
      - "ai-translate/**"
      - ".github/workflows/ai-translate-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "ai-translate/**"
      - ".github/workflows/ai-translate-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore original app source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ai-translate/project
          base64 -d ai-translate/AITranslate-source.tar.xz.base64 > /tmp/aitranslate-src.tar.xz
          echo "8b46e688ce6a956305cc775ebed758abfa74f68afc242b92558bfd2e2250e95d  /tmp/aitranslate-src.tar.xz" | sha256sum -c -
          tar -xJf /tmp/aitranslate-src.tar.xz -C ai-translate/project
          test -f ai-translate/project/app/build.gradle.kts
      - name: Install Android SDK Platform 35
        shell: bash
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        shell: bash
        working-directory: ai-translate/project
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AITranslate-Xiaomi14T-V0.1-debug-APK
          path: ai-translate/project/app/build/outputs/apk/debug/*.apk
          retention-days: 30
