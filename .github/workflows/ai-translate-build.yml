name: AI Translate Xiaomi14T V0.3 APK
on:
  push:
    branches:
      - build/ai-translate-xiaomi14t-v01
    paths:
      - "ai-translate/**"
      - ".github/workflows/ai-translate-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "ai-translate/**"
      - ".github/workflows/ai-translate-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore original app source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ai-translate/project
          base64 -d ai-translate/AITranslate-source.tar.xz.base64 > /tmp/aitranslate-src.tar.xz
          echo "8b46e688ce6a956305cc775ebed758abfa74f68afc242b92558bfd2e2250e95d  /tmp/aitranslate-src.tar.xz" | sha256sum -c -
          tar -xJf /tmp/aitranslate-src.tar.xz -C ai-translate/project
          test -f ai-translate/project/app/build.gradle.kts
          base64 -d ai-translate/AITranslate-V0.2-patch.tar.xz.base64 > /tmp/aitranslate-v02-patch.tar.xz
          echo "482a9ceb92f64f5eb55a16eec64ae18b097eeec80bda87e93abc33cbe305ac6f  /tmp/aitranslate-v02-patch.tar.xz" | sha256sum -c -
          tar -xJf /tmp/aitranslate-v02-patch.tar.xz -C ai-translate/project
          base64 -d ai-translate/AITranslate-V0.3-native-asr.tar.xz.base64 > /tmp/aitranslate-v03-patch.tar.xz
          echo "e2607e8f246dcb6376bf3080e34d822eae7da7e09bc84b6761fe6cd77fd2a707  /tmp/aitranslate-v03-patch.tar.xz" | sha256sum -c -
          tar -xJf /tmp/aitranslate-v03-patch.tar.xz -C ai-translate/project
          grep -q 'versionCode = 3' ai-translate/project/app/build.gradle.kts
      - name: Download official SenseVoice multilingual int8 model
        shell: bash
        run: |
          set -euo pipefail
          MODEL_URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17.tar.bz2"
          curl --fail --location --retry 4 --retry-delay 3 "$MODEL_URL" --output /tmp/sensevoice-int8.tar.bz2
          mkdir -p /tmp/sensevoice
          tar -xjf /tmp/sensevoice-int8.tar.bz2 -C /tmp/sensevoice
          MODEL_DIR="$(find /tmp/sensevoice -type f -name model.int8.onnx -printf "%h\\n" | head -1)"
          test -s "$MODEL_DIR/model.int8.onnx"
          test -s "$MODEL_DIR/tokens.txt"
          mkdir -p ai-translate/project/app/src/main/assets/sensevoice
          cp "$MODEL_DIR/model.int8.onnx" "$MODEL_DIR/tokens.txt" ai-translate/project/app/src/main/assets/sensevoice/
          ls -lh ai-translate/project/app/src/main/assets/sensevoice/
          sed -i 's/minHeight = d(140)/minimumHeight = d(140)/' ai-translate/project/app/src/main/java/com/iraqhub/aitranslate/MainActivity.kt
          sed -i 's/Gravity.TOP or Gravity.START/Gravity.TOP or Gravity.LEFT/' ai-translate/project/app/src/main/java/com/iraqhub/aitranslate/TranslateService.kt
          sed -i "s/import com.google.mlkit.nl.translate.DownloadConditions/import com.google.mlkit.common.model.DownloadConditions/" ai-translate/project/app/src/main/java/com/iraqhub/aitranslate/TranslateService.kt
      - name: Install Android SDK Platform 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        shell: bash
        working-directory: ai-translate/project
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AITranslate-Xiaomi14T-V0.3-debug-APK
          path: ai-translate/project/app/build/outputs/apk/debug/*.apk
          retention-days: 30
