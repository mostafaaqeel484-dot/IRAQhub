name: AI Translate MT5889 V0.6 speaker-aware offline HDMI
on:
  push:
    branches: [build/aitranslate-mt5889-speaker-aware-v06]
    paths:
      - "ai-translate/MT5889-V06-SpeakerPatch.tar.xz.base64"
      - ".github/workflows/aitranslate-mt5889-v06.yml"
  pull_request:
    branches: [main]
    paths:
      - "ai-translate/MT5889-V06-SpeakerPatch.tar.xz.base64"
      - ".github/workflows/aitranslate-mt5889-v06.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore V0.6 source and verify archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ai-translate/v06
          base64 -d ai-translate/MT5889-V06-SpeakerPatch.tar.xz.base64 > /tmp/mt5889-v06.tar.xz
          echo "8b34ac469f62dedfeabb154931f2dc66fd21356511cb9f1051b8fcebbf439509  /tmp/mt5889-v06.tar.xz" | sha256sum -c -
          tar -xJf /tmp/mt5889-v06.tar.xz -C ai-translate/v06
          grep -q 'versionCode = 6' ai-translate/v06/tv/build.gradle.kts
          test -f ai-translate/v06/tv/src/main/java/com/iraqhub/aitranslate/tv/SpeakerTracker.kt
      - name: Install Android SDK Platform 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Download SenseVoice Japanese English offline model
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17.tar.bz2"
          curl -fL --retry 4 --retry-delay 4 -o /tmp/sensevoice.tar.bz2 "$URL"
          mkdir -p /tmp/sensevoice ai-translate/v06/tv/src/main/assets/sensevoice
          tar -xjf /tmp/sensevoice.tar.bz2 -C /tmp/sensevoice
          DIR=/tmp/sensevoice/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17
          test "$(stat -c %s "$DIR/model.int8.onnx")" -gt 100000000
          cp "$DIR/model.int8.onnx" "$DIR/tokens.txt" ai-translate/v06/tv/src/main/assets/sensevoice/
      - name: Download lightweight Silero speech detection model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ai-translate/v06/tv/src/main/assets/vad
          curl -fL --retry 4 --retry-delay 4 -o ai-translate/v06/tv/src/main/assets/vad/silero_vad.onnx "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx"
          test "$(stat -c %s ai-translate/v06/tv/src/main/assets/vad/silero_vad.onnx)" -gt 1000000
      - name: Download verified CampPlus anonymous speaker embedding model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ai-translate/v06/tv/src/main/assets/speaker
          curl -fL --retry 4 --retry-delay 4 -o ai-translate/v06/tv/src/main/assets/speaker/speaker.onnx "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_campplus_sv_zh_en_16k-common_advanced.onnx"
          echo "aa3cfc16963a10586a9393f5035d6d6b57e98d358b347f80c2a30bf4f00ceba2  ai-translate/v06/tv/src/main/assets/speaker/speaker.onnx" | sha256sum -c -
      - name: Assemble Android TV standalone app
        shell: bash
        working-directory: ai-translate/v06
        run: gradle :tv:assembleDebug --no-daemon --stacktrace
      - name: Verify APK and CPU native ABIs
        shell: bash
        run: |
          set -euo pipefail
          APK=ai-translate/v06/tv/build/outputs/apk/debug/tv-debug.apk
          unzip -t "$APK" | tail -1
          unzip -Z1 "$APK" | grep 'assets/sensevoice/model.int8.onnx'
          unzip -Z1 "$APK" | grep 'assets/vad/silero_vad.onnx'
          unzip -Z1 "$APK" | grep 'assets/speaker/speaker.onnx'
          unzip -Z1 "$APK" | grep 'lib/arm64-v8a/libsherpa-onnx-jni.so'
          unzip -Z1 "$APK" | grep 'lib/armeabi-v7a/libsherpa-onnx-jni.so'
          sha256sum "$APK"
      - name: Upload V0.6 APK
        uses: actions/upload-artifact@v4
        with:
          name: AITranslate-MT5889-V0.6-Speaker-Aware-HDMI-APK
          path: ai-translate/v06/tv/build/outputs/apk/debug/*.apk
          retention-days: 30
