name: Build Freedom Picture 1.3 ADB test
on:
  push:
    branches: [feature/freedom-picture-130-adb-grants-20261108]
    paths:
      - .source/freedom_picture_13_overlay.py
      - .github/workflows/freedom-picture-adb-build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unpack original Freedom Picture 1.2 project
        run: unzip -q .source/FreedomPicture_1.2_Source.zip -d .
      - name: Apply 1.3 ADB permission patch
        run: python3 .source/freedom_picture_13_overlay.py
      - name: Build debug APK
        working-directory: FreedomPicture_1_2
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify manifest and publish APK to branch
        run: |
          APK=FreedomPicture_1_2/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump permissions "$APK" | tee /tmp/freedom_picture_permissions.txt
          grep 'android.permission.WRITE_SECURE_SETTINGS' /tmp/freedom_picture_permissions.txt
          grep 'android.permission.READ_LOGS' /tmp/freedom_picture_permissions.txt
          grep 'android.permission.DUMP' /tmp/freedom_picture_permissions.txt
          cp "$APK" FreedomPicture_1.3_Debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FreedomPicture_1.3_Debug.apk
          git -c commit.gpgsign=false commit -m "build: Freedom Picture 1.3 ADB grant trial APK [skip ci]"
          git push origin HEAD:refs/heads/feature/freedom-picture-130-adb-grants-20261108
