name: Build Freedom Picture 1.2 Vendor PQ
on:
  push:
    branches:
      - feature/freedom-picture-120-vendor-hidl-20261108
    paths:
      - .source/FreedomPicture_1.2_Source.zip
      - .github/workflows/freedom-picture-12-build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract independent 1.2 source
        run: unzip -q .source/FreedomPicture_1.2_Source.zip -d .
      - name: Compile Android APK
        working-directory: FreedomPicture_1_2
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK exists
        run: |
          test -s FreedomPicture_1_2/app/build/outputs/apk/debug/app-debug.apk
          unzip -t FreedomPicture_1_2/app/build/outputs/apk/debug/app-debug.apk | tail -n 1
      - name: Publish APK directly to source branch (avoids Actions artifact storage quota)
        run: |
          cp FreedomPicture_1_2/app/build/outputs/apk/debug/app-debug.apk FreedomPicture_1.2_Debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FreedomPicture_1.2_Debug.apk
          git -c commit.gpgsign=false commit -m "build: Freedom Picture 1.2 APK [skip ci]"
          git push origin HEAD:refs/heads/feature/freedom-picture-120-vendor-hidl-20261108
