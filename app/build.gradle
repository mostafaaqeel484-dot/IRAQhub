plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
 namespace 'com.smarthub.plus'
 compileSdk 36
 // TS9 X5M exposes only armeabi-v7a. MPV 1.0.0 expects floating-point
 // libc++ std::to_chars unavailable in the old first-picked VLC runtime.
 ndkVersion '28.2.13676358'
 packaging { jniLibs { pickFirsts += ['**/libc++_shared.so'] } }
 def releaseStore = System.getenv('IRAQHUB_KEYSTORE_PATH')
 def releaseAlias = System.getenv('IRAQHUB_KEY_ALIAS')
 def releaseStorePass = System.getenv('IRAQHUB_STORE_PASSWORD')
 def releaseKeyPass = System.getenv('IRAQHUB_KEY_PASSWORD')
 signingConfigs {
  if(releaseStore && releaseAlias && releaseStorePass && releaseKeyPass){
   production {
    storeFile file(releaseStore)
    storePassword releaseStorePass
    keyAlias releaseAlias
    keyPassword releaseKeyPass
   }
  }
 }
 buildTypes {
  release {
   if(releaseStore && releaseAlias && releaseStorePass && releaseKeyPass)
    signingConfig signingConfigs.production
  }
 }
 defaultConfig { ndk { abiFilters 'armeabi-v7a','arm64-v8a' }; applicationId 'com.smarthub.plus'; minSdk 26; targetSdk 34; versionCode 40; versionName '4.0.0-alpha1'; testInstrumentationRunner 'com.smarthub.plus.DeviceProvisionInstrumentation' }
 kotlinOptions { jvmTarget = '11' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
 testOptions { unitTests.returnDefaultValues=true }
}
dependencies {
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
 implementation 'androidx.core:core:1.15.0'
 implementation 'androidx.work:work-runtime:2.10.1'
 implementation 'androidx.media3:media3-exoplayer:1.5.1'
 implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
 implementation 'androidx.media3:media3-exoplayer-dash:1.5.1'
 implementation 'androidx.media3:media3-ui:1.5.1'
 implementation 'org.videolan.android:libvlc-all:3.7.0'
 // X5M compatibility trial: upstream libmpv Android 1.0.0 is the
 // stable pre-MakD-Vulkan AAR. Same dev.jdtech.mpv.MPVLib API, but fewer
 // new native/Vulkan dependencies for older TV ROMs. Do not ship both AARs.
 implementation 'dev.jdtech.mpv:libmpv:1.0.0'
 implementation 'com.caverock:androidsvg-aar:1.4'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'com.google.mlkit:translate:17.0.3'
 implementation 'com.google.mlkit:language-id:17.0.6'
 implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
}

// AGP mergeNativeLibs chooses duplicate libc++_shared.so via pickFirst,
// silently selecting an old dependency. Replace ONLY the merged libc++
// with the pinned modern Android NDK runtime BEFORE strip/package for
// both Debug/Release, leaving MPV/VLC and the OEM/DVB libs untouched.
tasks.matching { it.name in ['mergeDebugNativeLibs','mergeReleaseNativeLibs'] }
 .configureEach { mergeTask ->
  mergeTask.doLast {
   def home=System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT') ?: android.sdkDirectory.absolutePath
   def toolchains=new File(home,'ndk/28.2.13676358/toolchains/llvm/prebuilt')
   def hosts=toolchains.listFiles()?.findAll { new File(it,'sysroot/usr/lib').isDirectory() }
   if(!hosts)throw new GradleException("Pinned NDK r28c libc++ not installed: "+toolchains)
   def sysroot=new File(hosts.first(),'sysroot/usr/lib')
   def architectures=['armeabi-v7a':'arm-linux-androideabi','arm64-v8a':'aarch64-linux-android']
   architectures.each { abi,triple ->
    def modern=new File(sysroot,triple+'/libc++_shared.so')
    if(!modern.isFile())throw new GradleException("Pinned libc++ missing "+modern)
    def targets=[]
    mergeTask.outputs.files.files.findAll {it.isDirectory()}.each { out ->
     [new File(out,'lib/'+abi+'/libc++_shared.so'),
      new File(out,abi+'/libc++_shared.so')].each { candidate ->
      if(candidate.isFile())targets.add(candidate)
     }
    }
    if(targets.size()!=1)
     throw new GradleException("Expected exactly one merged "+abi+" libc++; found "+targets)
    java.nio.file.Files.copy(modern.toPath(),targets[0].toPath(),
      java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    logger.lifecycle("IRAQhub "+abi+": replaced AAR pickFirst libc++ with pinned NDK r28c ("+modern.length()+" bytes)")
   }
  }
 }
