plugins { id 'com.android.application' }
android {
    namespace 'com.iraqhub.livefeed'
    compileSdk 35
    defaultConfig {
        applicationId 'com.iraqhub.livefeed'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'org.jsoup:jsoup:1.18.3'
}
